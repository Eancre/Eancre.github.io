<a class="skip-link" href="#contenu">Aller au contenu principal</a>
{% include consent.html %}
<nav id="nav" aria-label="Navigation principale"{% unless page.url == "/" %} class="light-nav"{% endunless %}>
  <a href="/" class="nav-logo"><img src="/images/Petit_logo_retour_accueil.webp" width="29" height="52" fetchpriority="high" alt="l'eancre — Accueil"></a>
  <ul class="nav-links">
    <li><a href="/apropos/"{% if page.url contains "/apropos" %} class="active" aria-current="page"{% endif %}>Notre mission</a></li>
    <li><a href="/projets/"{% if page.url contains "/projets" %} class="active" aria-current="page"{% endif %}>Nos projets</a></li>
    <li><a href="/actualites/"{% if page.url contains "/actualites" %} class="active" aria-current="page"{% endif %}>Actualités</a></li>
    <li><a href="/contact/"{% if page.url contains "/contact" %} class="active" aria-current="page"{% endif %}>Contact</a></li>
    <li><a href="/don/" class="nav-cta{% if page.url contains "/don" %} active{% endif %}"{% if page.url contains "/don" %} aria-current="page"{% endif %}>Faire un don</a></li>
  </ul>
  <button class="nav-burger" id="burger" aria-label="Menu" aria-expanded="false" aria-controls="navMobile"><span></span><span></span><span></span></button>
</nav>
<div class="nav-mobile" id="navMobile">
  <button class="nav-mobile-close" id="navClose" aria-label="Fermer le menu">✕</button>
  <a href="/">Accueil</a><a href="/apropos/">Notre mission</a><a href="/projets/">Nos projets</a><a href="/actualites/">Actualités</a><a href="/don/">Faire un don</a><a href="/contact/">Contact</a>
</div>
<script>
// Menu mobile (burger) : défini une seule fois ici pour toutes les pages
(function () {
  var burger = document.getElementById('burger');
  var navMob = document.getElementById('navMobile');
  var closeBtn = document.getElementById('navClose');
  function setOpen(open) {
    navMob.classList.toggle('open', open);
    burger.classList.toggle('open', open);
    burger.setAttribute('aria-expanded', open ? 'true' : 'false');
    document.body.style.overflow = open ? 'hidden' : '';
  }
  burger.addEventListener('click', function () { setOpen(!burger.classList.contains('open')); });
  navMob.querySelectorAll('a').forEach(function (a) { a.addEventListener('click', function () { setOpen(false); }); });
  closeBtn.addEventListener('click', function () { setOpen(false); });
  document.addEventListener('click', function (e) {
    if (navMob.classList.contains('open') && !navMob.contains(e.target) && !burger.contains(e.target)) setOpen(false);
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });
})();
</script>
<main id="contenu" tabindex="-1">
